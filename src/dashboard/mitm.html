<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MITM Proxy — 9Router</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/dashboard/style.css">
</head>
<body data-page="mitm">
  <div class="layout">
    <aside class="sidebar"></aside>
    <main class="main">
      <div id="error-banner" class="banner banner-error hidden" role="alert" aria-live="polite"></div>
      <header class="page-header">
        <div>
          <h1 class="page-title">MITM Interception</h1>
          <p class="page-subtitle">Intercept local AI client domains and route through 9Router aliases</p>
        </div>
        <button id="mitm-refresh" type="button" class="btn">Refresh</button>
      </header>

      <section class="card">
        <h2 class="card-title">MITM Status &amp; Configuration</h2>
        <div class="toggle-row mb-12">
          <label for="mitm-enabled">Enable MITM DNS/Proxy Interception</label>
          <input id="mitm-enabled" type="checkbox">
        </div>
        <div class="field" style="max-width:360px">
          <label for="mitm-port">MITM Listen Port</label>
          <input id="mitm-port" type="number" value="8443">
        </div>
        <button id="mitm-save" type="button" class="btn btn-primary">Save MITM Settings</button>
      </section>

      <section class="card">
        <h2 class="card-title">Model Aliases</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Alias</th><th>Target Model</th></tr></thead>
            <tbody id="mitm-alias-tbody"><tr><td colspan="2" class="mono">Loading...</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="/dashboard/app.js"></script>
  <script>
    window.__NR.pages["mitm"] = async function () {
      var nr = window.__NR;
      var enabledChk = document.getElementById("mitm-enabled");
      var portInput = document.getElementById("mitm-port");

      async function load() {
        try {
          var s = await nr.apiFetch("/api/settings");
          enabledChk.checked = !!s.mitmEnabled;
          if (s.mitmPort) portInput.value = s.mitmPort;
        } catch (err) {
          nr.showBanner("Failed to load settings: " + err.message, "error");
        }

        var tbody = document.getElementById("mitm-alias-tbody");
        try {
          var a = await nr.apiFetch("/api/models/alias");
          var aliases = a.aliases || a || {};
          var entries = Object.keys(aliases);
          if (entries.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2">No model aliases configured.</td></tr>';
          } else {
            tbody.innerHTML = "";
            entries.forEach(function (k) {
              var tr = document.createElement("tr");
              tr.innerHTML = '<td class="mono">' + nr.escapeHtml(k) + '</td><td class="mono">' + nr.escapeHtml(String(aliases[k])) + "</td>";
              tbody.appendChild(tr);
            });
          }
        } catch (e) {
          tbody.innerHTML = '<tr><td colspan="2">Model alias endpoint unavailable.</td></tr>';
        }
      }

      document.getElementById("mitm-save").addEventListener("click", async function () {
        try {
          await nr.apiFetch("/api/settings", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mitmEnabled: !!enabledChk.checked, mitmPort: Number(portInput.value || 8443) })
          });
          nr.showBanner("MITM settings saved.", "success");
        } catch (err) {
          nr.showBanner("Save failed: " + err.message, "error");
        }
      });

      document.getElementById("mitm-refresh").addEventListener("click", load);
      await load();
    };
  </script>
</body>
</html>
