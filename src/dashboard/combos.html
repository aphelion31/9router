<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combos — 9Router</title>
  <link rel="stylesheet" href="/dashboard/style.css">
</head>
<body data-page="combos">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">9</span>
        <span>9Router</span>
      </div>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a class="nav-link" href="/dashboard">Dashboard</a></li>
          <li><a class="nav-link" href="/dashboard/endpoint">Endpoint &amp; Key</a></li>
          <li><a class="nav-link" href="/dashboard/providers">Providers</a></li>
          <li><a class="nav-link" href="/dashboard/combos" aria-current="page">Combos</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn" type="button" class="btn" style="width:100%">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <div id="error-banner" class="banner banner-error hidden" role="alert" aria-live="polite"></div>
      <header class="page-header">
        <div>
          <h1 class="page-title">Combos</h1>
          <p class="page-subtitle">Model routing combos and fallback chains</p>
        </div>
      </header>
      <section class="card" aria-labelledby="combos-heading">
        <h2 id="combos-heading" class="card-title">Configured Combos</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Kind</th>
                <th>Models</th>
                <th>Updated</th>
              </tr>
            </thead>
            <tbody id="combos-tbody">
              <tr><td colspan="4" class="mono">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="/dashboard/app.js"></script>
</body>
</html>
